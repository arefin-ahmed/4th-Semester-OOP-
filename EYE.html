<!doctype html>
<html>
  <head>
    <title>God's Eye System</title>
    <style>
      body {
        margin: 0;
        background-color: #0a0f1c;
        font-family: Arial, sans-serif;
        color: #00ffcc;
      }

      header {
        background: black;
        padding: 15px;
        text-align: center;
        font-size: 24px;
        letter-spacing: 3px;
        border-bottom: 2px solid #00ffcc;
      }

      .search-bar {
        padding: 15px;
        text-align: center;
      }

      input {
        padding: 8px;
        width: 250px;
        background: #111;
        border: 1px solid #00ffcc;
        color: #00ffcc;
      }

      button {
        padding: 8px 15px;
        background: #00ffcc;
        border: none;
        cursor: pointer;
      }

      .main {
        display: flex;
        height: 60vh;
      }

      .map {
        flex: 3;
        background: url("https://i.imgur.com/6Iej2c3.jpg");
        background-size: cover;
        border: 2px solid #00ffcc;
        margin: 10px;
        position: relative;
      }

      .target-dot {
        width: 15px;
        height: 15px;
        background: red;
        border-radius: 50%;
        position: absolute;
        top: 50%;
        left: 50%;
        animation: pulse 1s infinite;
      }

      @keyframes pulse {
        0% {
          transform: scale(1);
          opacity: 1;
        }
        100% {
          transform: scale(2);
          opacity: 0;
        }
      }

      .bottom-panels {
        display: flex;
        height: 25vh;
      }

      .panel {
        flex: 1;
        margin: 10px;
        padding: 10px;
        border: 1px solid #00ffcc;
        background-color: #111;
        overflow-y: auto;
      }
    </style>
  </head>

  <body>
    <header>GOD'S EYE SYSTEM</header>

    <div class="search-bar">
      <input type="text" placeholder="Enter Target Name" />
      <button>SCAN</button>
    </div>

    <div class="main">
      <div class="map">
        <div class="target-dot"></div>
      </div>
    </div>

    <div class="bottom-panels">
      <div class="panel">
        <h3>Camera Feed</h3>
        <p>Camera 01 - Active</p>
        <p>Camera 02 - Active</p>
      </div>

      <div class="panel">
        <h3>Target Info</h3>
        <p>Name: John Doe</p>
        <p>Status: Located</p>
        <p>Signal Strength: 98%</p>
      </div>

      <div class="panel">
        <h3>System Logs</h3>
        <p>Initializing scan...</p>
        <p>Satellite sync complete</p>
        <p>Target locked</p>
      </div>
    </div>
  </body>
</html>
